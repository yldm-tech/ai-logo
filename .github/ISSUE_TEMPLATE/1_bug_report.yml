name: "🐛 反馈缺陷 Bug Report"
description: "反馈一个问题缺陷 | Report a bug"
title: "[Bug] "
labels: "🐛 Bug"
body:
  - type: textarea
    attributes:
      label: "🐛 问题描述 | Bug Description"
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: input
    attributes:
      label: "📦 版本 | Version"
      description: "The version of @yldm-tech/ai-logo you are on. | 你使用的 @yldm-tech/ai-logo 版本。"
      placeholder: "1.3.2"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "🚦 期望结果 | Expected Behavior"
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    attributes:
      label: "📷 复现步骤 | Recurrence Steps"
      description: A clear and concise description of how to recurrence.
  - type: textarea
    attributes:
      label: "🖥 运行环境 | Environment"
      description: "Bundler, framework and browser, if they are relevant. Most issues here are rendering or mapping issues that do not depend on any of them, so leave this blank when it does not apply. | 打包器、框架与浏览器（如果相关）。这里的多数问题与它们无关，不适用时留空即可。"
      placeholder: "Vite 8, React 19, Chrome"
  - type: textarea
    attributes:
      label: "📝 补充信息 | Additional Information"
      description: If your problem needs further explanation, or if the issue you're seeing cannot be reproduced in a gist, please add more information here.
