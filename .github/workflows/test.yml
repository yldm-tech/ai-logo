name: Test CI
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          cache: "pnpm"
          node-version: "24"

      - name: Install deps
        run: pnpm install

      # The demo's smoke test imports the package through node_modules to es/, the
      # way a consumer does, so es/ has to exist before the tests can run.
      - name: Build package
        run: pnpm run build

      - name: CI
        run: pnpm run ci

      - name: Test and coverage
        run: pnpm run test:coverage
