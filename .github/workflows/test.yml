name: Test CI
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install deps
        run: bun i

      - name: CI
        run: bun run ci

      - name: Test and coverage
        run: bun run test:coverage
