name: Test CI
on:
  pull_request:

# Read-only. Declared rather than left to the repository default, which the other two workflows already set and this one did not.
permissions:
  contents: read

# A new push to a pull request makes the run in flight irrelevant, so cancel it rather than paying for both.
concurrency:
  cancel-in-progress: true
  group: test-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "pnpm"
          node-version: "24"

      - name: Install deps
        run: pnpm install

      # The demo's smoke test imports the package through node_modules to es/, the
      # way a consumer does, so es/ has to exist before the tests can run.
      - name: Build package
        run: pnpm run build

      - name: CI
        run: pnpm run ci

      - name: Test and coverage
        run: pnpm run test:coverage

      # src/toc.json and the README icon table are committed build outputs. Regenerating them here and
      # failing on a diff is what stops them drifting from src/ — previously nothing checked either.
      - name: Generated artifacts are up to date
        run: |
          pnpm run sync:md
          npx remark --quiet --output -- README.md
          git diff --exit-code -- src/toc.json README.md

      # The demo consumes the built package through node_modules the way a real dependant does, which
      # the Build package step above has already produced. It also carries the bundle budgets, the
      # only guard against the kind of regression that shipped in 1.2.1.
      - name: Check the consumer demo
        run: |
          pnpm --dir apps/demo run type-check
          pnpm --dir apps/demo run test

      - name: Type-check the react-native port
        run: pnpm --dir packages/react-native run type-check
