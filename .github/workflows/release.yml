name: Release CI

# Runs on GitHub-hosted runners rather than the org's self-hosted ARC scale-set: this repository is public, and self-hosted runners on public repositories let fork workflows execute arbitrary code on org infrastructure. The ARC image also has neither pnpm nor a current Node.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Two pushes to main must not release concurrently: semantic-release decides the next version from the
# tags it can see, and a loser that started before the winner tagged would compute the same number.
# The run in flight is never cancelled — it may already have published.
concurrency:
  cancel-in-progress: false
  group: release

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      # A missing RELEASE_TOKEN would otherwise surface as a rejected push twelve minutes into the job, or as a checkout that quietly falls back to anonymous access. Name it here instead.
      - name: RELEASE_TOKEN is set
        run: |
          if [ -z "${RELEASE_TOKEN}" ]; then
            echo "::error::RELEASE_TOKEN is not set. semantic-release pushes the release commit to main, which is protected, so it needs a token belonging to a repository administrator — GITHUB_TOKEN cannot bypass the required status check. Create a fine-grained PAT scoped to this repository with contents, issues and pull-requests write, and store it as the RELEASE_TOKEN secret."
            exit 1
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # The token is on checkout, not only on the release step, because that is what actually signs the
      # push. semantic-release tries a plain `git push --dry-run` to the repository URL first and, when
      # that succeeds, pushes with no credentials of its own — so it inherits whatever actions/checkout
      # persisted, and GITHUB_TOKEN in the release step's env would never be consulted.
      #
      # It has to be a PAT because main requires the `test` check: GITHUB_TOKEN is not an administrator
      # and cannot bypass a required status check, while `enforce_admins` is deliberately off, so an
      # administrator's token can. A repository-level ruleset cannot solve this instead — GitHub rejects
      # the GitHub Actions app as a bypass actor there ("must be part of the ruleset source or owner
      # organization").
      #
      # Unlike GITHUB_TOKEN, a PAT's pushes do trigger workflows, which makes the `[skip ci]` in
      # semantic-release's commit message load-bearing: without it every release would start another one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: "pnpm"
          node-version: "24"

      - name: Install deps
        run: pnpm install

      - name: CI
        run: pnpm run ci

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # This gate used to be strictly weaker than the pull request one, and the gap was the part that reaches a consumer: apps/site is where the bundle budgets live, so nothing checked tree-shaking before a publish. The regression those budgets exist for — an icon import pulling in all 323, 3219 kB against 216 kB — type-checks and tests clean, which means every other step here would have passed it straight through to npm.
      #
      # The site also imports the package through node_modules the way a published dependency resolves, so its type-check and its smoke test are the closest thing this repository has to installing the tarball and using it. Both need es/, which the Build step above has just produced.
      - name: Check the site
        run: |
          pnpm --dir apps/site run type-check
          pnpm --dir apps/site run test

      # semantic-release writes the new version into package.json when it releases and leaves it alone when it does not, so comparing the version either side of this step says whether a release happened without asking the registry.
      - name: Release
        id: release
        run: |
          echo "version_before=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          pnpm run release
          echo "version_after=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # This repository was forked from lobehub/lobe-icons and its v5.x tags are still ancestors of
      # main, so the highest tag reachable from HEAD is v5.18.0 rather than anything on this project's
      # v1 line. semantic-release gets this right under the current branches config — it has been
      # cutting v1.x throughout — but a change to that config or to the tag set could quietly move the
      # line. Checking the version it actually produced cannot unpublish a wrong one, but it stops the
      # alias and the asset packages from following it and makes the jump impossible to miss.
      - name: Released version is on the v1 line
        if: steps.release.outputs.version_before != steps.release.outputs.version_after
        run: |
          version="${{ steps.release.outputs.version_after }}"
          echo "released: ${version}"
          case "${version}" in
            1.*) ;;
            *) echo "::error::Released ${version}, which is not on the v1 line. An upstream tag is probably being treated as this project's last release."; exit 1 ;;
          esac

      # semantic-release publishes @yldm-tech/ai-logo only. The unscoped `ai-logo` alias that re-exports
      # it and the four static asset packages the CDN helper resolves go out here, at the same version.
      #
      # `!cancelled()` rather than success(): if the release step fails after npm publish has already
      # run, package.json holds the new version and these scripts — each of which skips a name already
      # published at that version — complete the set instead of leaving it half-released forever. When
      # no release happened they are no-ops, because every name is already published at that version.
      #
      # What `!cancelled()` cannot tell on its own is which side of the publish the failure landed on.
      # @semantic-release/npm writes the new version into package.json during prepare, and two prepare
      # plugins run after it, so a failure there leaves the version bumped with nothing published. That
      # is how `ai-logo@1.9.1` reached the registry depending on a `@yldm-tech/ai-logo@1.9.1` that does
      # not exist, which makes `npm i ai-logo` fail outright: the release step died in
      # @semantic-release/git, one step before the publish.
      #
      # So the condition is the registry rather than the exit status — a name the alias points at has to
      # be there before the alias claiming it goes out. npm needs a moment to make a new version
      # readable, hence the retries; this runs seconds after the publish that creates it.
      - name: Released version is on the registry
        id: primary
        if: ${{ !cancelled() }}
        run: |
          version=$(node -p "require('./package.json').version")
          for _ in 1 2 3 4 5 6; do
            if npm view "@yldm-tech/ai-logo@${version}" version >/dev/null 2>&1; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "@yldm-tech/ai-logo@${version} is on the registry."
              exit 0
            fi
            sleep 10
          done
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "::warning::@yldm-tech/ai-logo@${version} is not on the registry, so the alias and the static packages are skipped. They would otherwise be published at a version the package they point at does not have."

      - name: Publish unscoped alias
        if: ${{ !cancelled() && steps.primary.outputs.published == 'true' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          scripts/publish-alias.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish static asset packages
        if: ${{ !cancelled() && steps.primary.outputs.published == 'true' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          scripts/publish-static.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
