name: Release CI

# Runs on GitHub-hosted runners rather than the org's self-hosted ARC scale-set: this repository is public, and self-hosted runners on public repositories let fork workflows execute arbitrary code on org infrastructure. The ARC image also has no bun.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Install deps
        run: bun i

      - name: CI
        run: bun run ci

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # semantic-release writes the new version into package.json when it releases and leaves it alone when it does not, so comparing the version either side of this step says whether a release happened without asking the registry.
      - name: Release
        id: release
        run: |
          echo "version_before=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          bun run release
          echo "version_after=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # semantic-release publishes one name; the scoped copy of the same build goes out here.
      - name: Publish scoped mirror
        if: steps.release.outputs.version_before != steps.release.outputs.version_after
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          scripts/publish-mirror.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
