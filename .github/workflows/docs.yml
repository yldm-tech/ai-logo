name: Docs

# Runs on GitHub-hosted runners rather than the org's self-hosted ARC scale-set: this repository is public, and self-hosted runners on public repositories let fork workflows execute arbitrary code on org infrastructure. The ARC image also has neither pnpm nor a current Node.
on:
  push:
    branches:
      - main
    paths:
      - "apps/demo/**"
      - "src/**"
      - "public/**"
      # The icon renders are staged into the site below, so a change to them changes what is deployed.
      - "packages/static-svg/**"
      - "packages/static-png/**"
      - "packages/static-webp/**"
      - "packages/static-avatar/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Actions are pinned to commit SHAs with the tag in a trailing comment. A tag is a moving pointer the upstream owner can repoint, and these jobs run with write scopes; Renovate keeps the pins current.

# Pages deployment authenticates through OIDC, so no token needs to be stored.
permissions:
  contents: read
  id-token: write
  pages: write

# A queued deploy supersedes a running one rather than racing it, but an
# in-flight deploy is allowed to finish so the site is never left half-written.
concurrency:
  cancel-in-progress: false
  group: pages

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          cache: "pnpm"
          node-version: "24"

      - name: Install deps
        run: pnpm install

      # The site imports the package the way a consumer does — through node_modules
      # to es/ — so es/ has to exist before the site can be built. A fresh checkout
      # has no build output.
      - name: Build package
        run: pnpm run build

      - name: Build site
        run: pnpm --dir apps/demo run build

      # The icon renders ride along with the site so they are reachable at a short
      # path on the custom domain — /svg/openai.svg rather than the monorepo layout
      # a CDN pointed straight at the repository would expose. Roughly 75 MB and
      # 4880 files on top of the site, well inside the 1 GB Pages limit.
      - name: Stage icon assets
        run: |
          out=apps/demo/dist
          cp -r packages/static-svg/icons "$out/svg"
          cp -r packages/static-png "$out/png"
          cp -r packages/static-webp "$out/webp"
          cp -r packages/static-avatar/avatars "$out/avatar"
          du -sh "$out"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Vite copies apps/demo/public into dist, and CNAME rides along with it,
      # which is what binds the custom domain.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/demo/dist

  deploy:
    name: Deploy
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
