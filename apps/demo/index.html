<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>AI Logo — 323 AI brand icons for React and CDN</title>
    <meta
      name="description"
      content="Logos for AI providers, models and applications as typed React components, with colour, wordmark, lockup and avatar variants, plus static SVG, PNG and WebP on a CDN. MIT licensed."
    />
    <link rel="canonical" href="https://ailogo.yldm.ai/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08080b" media="(prefers-color-scheme: dark)" />

    <!-- The language is client-side state, so every translation shares one URL with a `lang` parameter that pins it. These are the addresses a crawler indexes; `x-default` is the one to serve when it has no preference to go on. -->
    <link rel="alternate" hreflang="en" href="https://ailogo.yldm.ai/?lang=en" />
    <link rel="alternate" hreflang="zh-CN" href="https://ailogo.yldm.ai/?lang=zh-CN" />
    <link rel="alternate" hreflang="zh-TW" href="https://ailogo.yldm.ai/?lang=zh-TW" />
    <link rel="alternate" hreflang="ja" href="https://ailogo.yldm.ai/?lang=ja" />
    <link rel="alternate" hreflang="ko" href="https://ailogo.yldm.ai/?lang=ko" />
    <link rel="alternate" hreflang="es" href="https://ailogo.yldm.ai/?lang=es" />
    <link rel="alternate" hreflang="fr" href="https://ailogo.yldm.ai/?lang=fr" />
    <link rel="alternate" hreflang="de" href="https://ailogo.yldm.ai/?lang=de" />
    <link rel="alternate" hreflang="pt-BR" href="https://ailogo.yldm.ai/?lang=pt-BR" />
    <link rel="alternate" hreflang="ru" href="https://ailogo.yldm.ai/?lang=ru" />
    <link rel="alternate" hreflang="ar" href="https://ailogo.yldm.ai/?lang=ar" />
    <link rel="alternate" hreflang="x-default" href="https://ailogo.yldm.ai/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Logo" />
    <meta property="og:url" content="https://ailogo.yldm.ai/" />
    <meta property="og:title" content="AI Logo — 323 AI brand icons for React and CDN" />
    <meta
      property="og:description"
      content="Logos for AI providers, models and applications as typed React components, with colour, wordmark, lockup and avatar variants, plus static SVG, PNG and WebP on a CDN. MIT licensed."
    />
    <meta property="og:image" content="https://ailogo.yldm.ai/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AI Logo — a wall of AI brand marks" />
    <meta property="og:locale" content="en" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Logo — 323 AI brand icons for React and CDN" />
    <meta
      name="twitter:description"
      content="Logos for AI providers, models and applications as typed React components, with colour, wordmark, lockup and avatar variants, plus static SVG, PNG and WebP on a CDN. MIT licensed."
    />
    <meta name="twitter:image" content="https://ailogo.yldm.ai/og.png" />

    <!-- The package rather than the page: this is what a search engine reads to know the thing has a name, a licence, a repository and an installer. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "AI Logo",
        "alternateName": "@yldm-tech/ai-logo",
        "description": "Brand marks for AI providers, models and applications, as typed React components and as static SVG, PNG and WebP on a CDN.",
        "url": "https://ailogo.yldm.ai/",
        "codeRepository": "https://github.com/yldm-tech/ai-logo",
        "programmingLanguage": "TypeScript",
        "runtimePlatform": "React",
        "license": "https://opensource.org/licenses/MIT",
        "keywords": "ai icons, ai logo, llm brand logo, llm icons, react components, svg icons",
        "author": { "@type": "Organization", "name": "yldm-tech" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The page is client-rendered, so this is what a reader without JavaScript gets, and what a crawler that does not run it can still read and follow. -->
    <noscript>
      <h1>AI Logo</h1>
      <p>
        Brand marks for AI providers, models and applications, as typed React components and as
        static SVG, PNG and WebP on a CDN. MIT licensed.
      </p>
      <p><code>npm i @yldm-tech/ai-logo</code></p>
      <ul>
        <li><a href="https://github.com/yldm-tech/ai-logo">Source on GitHub</a></li>
        <li><a href="https://www.npmjs.com/package/@yldm-tech/ai-logo">Package on npm</a></li>
        <li><a href="https://ailogo.yldm.ai/svg/openai.svg">Example mark: openai.svg</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
