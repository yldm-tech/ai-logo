packages:
  - "*"
  - "packages/*"
  - "apps/*"
allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true
  puppeteer: true
  sharp: true
  unrs-resolver: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
  "@vitest/coverage-v8": 4.1.11
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
resolutionMode: highest
# The rc files hand remark, stylelint, commitlint, semantic-release and changelog a list of plugins by name, and every one of those tools resolves the names from the repository root rather than from the config that named them. Under pnpm's isolated store they live in .pnpm and none of them resolve, so they have to be hoisted into the root node_modules.
publicHoistPattern:
  - "*@umijs/lint*"
  - "*changelog*"
  - "*commitlint*"
  - "*eslint*"
  - "*postcss*"
  - "*prettier*"
  - "*remark*"
  - "*semantic-release*"
  - "*stylelint*"
